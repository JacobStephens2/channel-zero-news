<VirtualHost *:80>
    ServerName channel0.stephens.page
    ServerAdmin jacob.stephens.701@gmail.com

    # Upgrade WebSocket connections to the ws backend; everything else is plain
    # HTTP reverse-proxied to the Rust service on localhost.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*)$ "ws://127.0.0.1:3471/$1" [P,L]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3471/
    ProxyPassReverse / http://127.0.0.1:3471/

    ErrorLog ${APACHE_LOG_DIR}/channel0.stephens.page-error.log
    CustomLog ${APACHE_LOG_DIR}/channel0.stephens.page-access.log combined
</VirtualHost>
