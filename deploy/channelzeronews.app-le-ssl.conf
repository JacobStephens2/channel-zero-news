<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName channelzeronews.app
    ServerAlias www.channelzeronews.app
    ServerAdmin jacob@stephens.page

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.channelzeronews\.app$ [NC]
    RewriteRule ^ https://channelzeronews.app%{REQUEST_URI} [END,NE,R=permanent]

    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*)$ "ws://127.0.0.1:3471/$1" [P,L]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3471/
    ProxyPassReverse / http://127.0.0.1:3471/

    ErrorLog ${APACHE_LOG_DIR}/channelzeronews.app-error.log
    CustomLog ${APACHE_LOG_DIR}/channelzeronews.app-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/channelzeronews.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/channelzeronews.app/privkey.pem
</VirtualHost>
</IfModule>
