<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName channelzeronews.stephens.page
    ServerAdmin jacob.stephens.701@gmail.com

    # Cut over to the Rust/Axum realtime backend (channel-zero service).
    # Upgrade WebSocket connections; reverse-proxy everything else.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*)$ "ws://127.0.0.1:3471/$1" [P,L]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3471/
    ProxyPassReverse / http://127.0.0.1:3471/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

SSLCertificateFile /etc/letsencrypt/live/channelzeronews.stephens.page/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/channelzeronews.stephens.page/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
