<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Channel 0 News — realtime test client</title>
<style>
  :root { --bg:#0b0f17; --panel:#141b29; --ink:#e8eef7; --muted:#8aa0bf; --accent:#ff3b3b; --ok:#36d399; --line:#243049; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); overflow-x:hidden; }
  header { background:var(--accent); color:#fff; padding:10px 16px; font-weight:800; letter-spacing:.5px; display:flex; gap:12px; align-items:center; }
  header .live { font-size:11px; background:#000; padding:2px 8px; border-radius:99px; }
  header .conn-group { margin-left:auto; display:flex; gap:8px; align-items:center; }
  #roomPill { background:#0c121d; color:#fff; border-color:rgba(255,255,255,.4); font-weight:700; }
  main { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  .toggle { float:right; background:#0c121d; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:0 8px; line-height:1.6; cursor:pointer; }
  .full { grid-column:1/3; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  input, textarea, select, button { font:inherit; }
  input, textarea, select { width:100%; background:#0c121d; border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:8px; }
  textarea { resize:vertical; min-height:54px; }
  button { background:#1f2d45; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:8px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row > * { flex:1; }
  .row > button { flex:0 0 auto; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:#0c121d; border:1px solid var(--line); }
  .players { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
  .players li { display:flex; justify-content:space-between; padding:6px 10px; background:#0c121d; border:1px solid var(--line); border-radius:7px; }
  .submitted { color:var(--ok); }
  #log { font-family:ui-monospace,Menlo,monospace; font-size:12px; height:200px; overflow:auto; background:#0c121d; border:1px solid var(--line); border-radius:7px; padding:8px; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
  #slide { min-height:160px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:20px; padding:20px; background:#0c121d; border:1px dashed var(--line); border-radius:10px; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; background:var(--accent); color:#fff; font-weight:800; font-size:14px; letter-spacing:.5px; padding:4px 14px; border-radius:99px; margin-bottom:18px; }
  .reading-now { font-size:clamp(22px,4vw,40px); line-height:1.3; }
  .reading-now strong { color:var(--accent); }
  .hidden { display:none; }
  code { background:#0c121d; padding:2px 6px; border-radius:5px; }
  /* Phone widths: one column so the panels aren't cramped, and stack the
     cramped input/button rows vertically. */
  @media (max-width: 720px) {
    main { grid-template-columns:minmax(0,1fr); }
    .full { grid-column:1; }
    .row { flex-direction:column; align-items:stretch; }
    .row > button { width:100%; }
  }
  /* Display role during the performance: the slide takes over the whole screen
     (teleprompter mode). Everything else is hidden. */
  body.stage-mode header,
  body.stage-mode main > section:not(#slidePanel) { display:none; }
  body.stage-mode main { display:block; max-width:none; padding:0; }
  body.stage-mode #slidePanel {
    position:fixed; inset:0; z-index:1000; margin:0; border:0; border-radius:0;
    background:var(--bg); display:flex; flex-direction:column;
  }
  body.stage-mode #slidePanel h2 { position:absolute; top:10px; right:14px; margin:0; opacity:.5; }
  #exitStage { position:absolute; top:10px; left:14px; z-index:1001; background:#0c121d; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 12px; cursor:pointer; }
  body.stage-mode #slide {
    flex:1; border:0; background:transparent; line-height:1.15; padding:3vw;
    font-size:64px; /* fallback; Performance stage sizes it to fill the screen */
    overflow:hidden;
  }
  /* Readable, balanced slide text. The stage and the full-width reader view
     constrain line length and let names pop. */
  .stage-content { margin:0 auto; line-height:1.3; text-wrap:balance; }
  .stage-content strong { color:var(--accent); }
  body.stage-mode .stage-content { max-width:none; }
  /* When a panel takes the full width (host while performing, or the reader's
     own turn), make the stage text larger and give it room. */
  .panel.full #slide { font-size:clamp(22px,3.2vw,40px); min-height:240px; }
  .panel.full .stage-content { max-width:32ch; }
</style>
</head>
<body>
<header>
  📺 THE CHANNEL 0 NEWS <span class="live">● REALTIME</span>
  <span class="conn-group">
    <span id="roomPill" class="pill hidden"></span>
    <span id="conn" class="pill">disconnected</span>
  </span>
</header>

<main>
  <!-- connection -->
  <section class="panel full">
    <h2>Connect</h2>
    <div class="row">
      <div>
        <label>Role</label>
        <select id="role">
          <option value="player">Player</option>
          <option value="host">Host (control panel)</option>
          <option value="display">Display / submissions screen</option>
        </select>
      </div>
      <div id="codeField">
        <label>Room code</label>
        <input id="code" placeholder="ABCD" maxlength="8" autocapitalize="characters">
      </div>
      <div id="nameField" class="hidden">
        <label>Your name</label>
        <input id="pname" placeholder="Ann">
      </div>
      <button id="createBtn" class="primary">Create room</button>
      <button id="joinBtn">Connect</button>
    </div>
    <p id="hostCreds" class="muted hidden" style="margin:10px 0 0"></p>
  </section>

  <!-- host controls -->
  <section class="panel hidden" id="hostPanel">
    <h2>Host controls</h2>
    <div class="row">
      <div><label>Add player</label><input id="newPlayer" placeholder="Name"></div>
      <button id="addBtn">Add</button>
    </div>
    <div class="row" style="margin-top:10px; flex-wrap:wrap">
      <button id="collectBtn">Open submissions</button>
      <button id="startBtn">Start game</button>
    </div>
    <div class="row" style="margin-top:6px; flex-wrap:wrap">
      <button id="prevBtn">◀ Prev slide</button>
      <button id="nextBtn">Next slide ▶</button>
      <button id="archiveBtn">Archive round</button>
      <button id="newRoundBtn">New round</button>
    </div>
  </section>

  <!-- player form -->
  <section class="panel hidden" id="playerPanel">
    <h2>Your prompts
      <span id="submittedTag" class="submitted hidden">✓ submitted</span>
      <button id="promptsToggle" class="toggle hidden" title="Show / hide your prompts">▾</button>
    </h2>
    <p id="partnerLine" class="muted">Join to receive your assignment.</p>
    <div id="promptsBody">
      <div id="promptFields"></div>
      <button id="submitBtn" class="primary hidden" style="margin-top:10px">Submit responses</button>
    </div>
  </section>

  <!-- room state -->
  <section class="panel" id="statePanel">
    <h2>Room — <span id="phasePill" class="pill">—</span></h2>
    <p class="muted" id="progressLine">No room yet.</p>
    <ul class="players" id="playerList"></ul>
  </section>

  <!-- slide / display -->
  <section class="panel" id="slidePanel">
    <button id="exitStage" class="hidden">✕ Exit full screen</button>
    <h2>Stage <span id="slideIdx" class="pill">—</span>
      <button id="enterStage" class="toggle hidden" title="Full screen">⛶ Full screen</button>
    </h2>
    <div id="slide" class="muted">The carousel will appear here once the game starts.</div>
    <div id="readerControls" class="row hidden" style="margin-top:12px">
      <button id="rPrev">◀ Prev</button>
      <button id="rNext" class="primary">Next ▶</button>
    </div>
  </section>

  <!-- log -->
  <section class="panel full" id="logPanel">
    <h2>Event log (everything the server pushes)</h2>
    <div id="log"></div>
  </section>
</main>

<script type="module">
import { createRoomSession } from "./room-session.mjs";
import { createPlayerRoundParticipation } from "./player-round-participation.mjs";
import { createPerformanceStage } from "./performance-stage.mjs";

const $ = (id) => document.getElementById(id);

const session = createRoomSession({
  createSocket: () => new WebSocket(wsUrl()),
  storage: {
    getItem: (key) => sessionStorage.getItem(key),
    setItem: (key, value) => sessionStorage.setItem(key, value),
    removeItem: (key) => sessionStorage.removeItem(key),
  },
  onChange: renderSession,
  onMessage: (message) => { log("←", message); handle(message); },
  onError: (message) => { log("!", message); alert(message); },
  onSend: (message) => log("→", message),
});
const participation = createPlayerRoundParticipation({ document, send: (intent) => session.send(intent) });
const performance = createPerformanceStage({ document, window, send: (intent) => session.send(intent) });

function log(dir, obj) {
  const el = $("log");
  const t = new Date().toLocaleTimeString();
  el.textContent += `${t} ${dir} ${JSON.stringify(obj)}\n`;
  el.scrollTop = el.scrollHeight;
}

function wsUrl() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}/ws`;
}

// ---- role UI toggling ----
function applyRoleUI() {
  const pendingRole = $("role").value;
  const role = session.current.role || pendingRole;
  $("nameField").classList.toggle("hidden", pendingRole !== "player");
  $("createBtn").classList.toggle("hidden", pendingRole !== "host");
  $("hostPanel").classList.toggle("hidden", role !== "host");
  $("playerPanel").classList.toggle("hidden", role !== "player");
  // The host creates a room and is *given* a code; only players/display type
  // one in to join. Hiding the code input avoids the impression that a typed
  // code is used at creation (the server always assigns a fresh unique code).
  $("codeField").classList.toggle("hidden", pendingRole === "host");
  $("joinBtn").classList.toggle("hidden", pendingRole === "host");
  // The raw event log is a debug aid for host/display; hide it from players.
  $("logPanel").classList.toggle("hidden", role === "player");
}
$("role").addEventListener("change", applyRoleUI);

// ---- create room (host) ----
$("createBtn").addEventListener("click", async () => {
  const res = await fetch("/api/rooms", { method: "POST" });
  if (!res.ok) { alert("create failed"); return; }
  const data = await res.json();
  $("code").value = data.code;
  $("hostCreds").classList.remove("hidden");
  $("hostCreds").innerHTML = `Room <code>${data.code}</code> created. Players join with this code. Host token held in this tab.`;
  log("REST", { created: data.code });
  session.connect({ code: data.code, role: "host", hostToken: data.host_token });
});

// ---- connect / join ----
$("joinBtn").addEventListener("click", () => session.connect({
  code: $("code").value, role: $("role").value, name: $("pname").value,
}));

function renderSession(view) {
  participation.updateSession(view);
  performance.updateSession(view);
  $("conn").textContent = ({ connecting: "connecting…", awaiting_joined: "joining…",
    joined: "connected", failed: "error", disconnected: "disconnected" })[view.state];
  $("roomPill").textContent = view.code ? `Room ${view.code}` : "";
  $("roomPill").classList.toggle("hidden", view.state !== "joined");
  if (view.state === "connecting") {
    $("phasePill").textContent = "—";
    $("progressLine").textContent = "Joining room…";
    $("playerList").innerHTML = "";
  }
  applyRoleUI();
}

// ---- server event handling (exhaustive) ----
function handle(msg) {
  participation.handle(msg);
  performance.handle(msg);
  switch (msg.type) {
    case "assignment": break;
    case "room_state": renderRoom(msg.room); break;
    case "submission_progress": renderProgress(msg); break;
    case "game_started":
    case "slide_changed": break;
    case "pong": break;
    case "error":
      alert(`${msg.code}: ${msg.message}`);
      break;
    default: console.warn("unknown server message", msg);
  }
}

function renderRoom(room) {
  $("phasePill").textContent = room.phase;
  $("progressLine").textContent = `${room.players.length} player(s) · phase: ${room.phase}`;
  renderPlayers(room.players);
}

function renderProgress(msg) {
  $("progressLine").textContent = `${msg.submitted} / ${msg.total} submitted`;
  renderPlayers(msg.players);
}
function renderPlayers(players) {
  $("playerList").innerHTML = players.map(p =>
    `<li><span>${escapeHtml(p.name)}</span>${p.submitted ? '<span class="submitted">✓ submitted</span>' : '<span class="muted">…</span>'}</li>`
  ).join("");
}

// ---- host control buttons ----
$("addBtn").addEventListener("click", () => {
  const name = $("newPlayer").value.trim();
  if (name) { session.send({ type: "add_player", name }); $("newPlayer").value = ""; }
});
$("collectBtn").addEventListener("click", () => session.send({ type: "start_collecting" }));
$("startBtn").addEventListener("click", () => session.send({ type: "start_game" }));
$("archiveBtn").addEventListener("click", () => session.send({ type: "archive_round" }));
$("newRoundBtn").addEventListener("click", () => session.send({ type: "new_round" }));

function escapeHtml(s) { return (s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

applyRoleUI();
if (session.restore()) {
  const { code, role, name } = session.current;
  $("role").value = role; $("code").value = code; $("pname").value = name || "";
  applyRoleUI();
}
</script>
</body>
</html>
