<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Channel 0 News — realtime test client</title>
<style>
  :root { --bg:#0b0f17; --panel:#141b29; --ink:#e8eef7; --muted:#8aa0bf; --accent:#ff3b3b; --ok:#36d399; --line:#243049; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); overflow-x:hidden; }
  header { background:var(--accent); color:#fff; padding:10px 16px; font-weight:800; letter-spacing:.5px; display:flex; gap:12px; align-items:center; }
  header .live { font-size:11px; background:#000; padding:2px 8px; border-radius:99px; }
  header .conn-group { margin-left:auto; display:flex; gap:8px; align-items:center; }
  #roomPill { background:#0c121d; color:#fff; border-color:rgba(255,255,255,.4); font-weight:700; }
  main { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  .toggle { float:right; background:#0c121d; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:0 8px; line-height:1.6; cursor:pointer; }
  .full { grid-column:1/3; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  input, textarea, select, button { font:inherit; }
  input, textarea, select { width:100%; background:#0c121d; border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:8px; }
  textarea { resize:vertical; min-height:54px; }
  button { background:#1f2d45; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:8px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row > * { flex:1; }
  .row > button { flex:0 0 auto; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:#0c121d; border:1px solid var(--line); }
  .players { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
  .players li { display:flex; justify-content:space-between; padding:6px 10px; background:#0c121d; border:1px solid var(--line); border-radius:7px; }
  .submitted { color:var(--ok); }
  #log { font-family:ui-monospace,Menlo,monospace; font-size:12px; height:200px; overflow:auto; background:#0c121d; border:1px solid var(--line); border-radius:7px; padding:8px; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
  #slide { min-height:160px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:20px; padding:20px; background:#0c121d; border:1px dashed var(--line); border-radius:10px; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; background:var(--accent); color:#fff; font-weight:800; font-size:14px; letter-spacing:.5px; padding:4px 14px; border-radius:99px; margin-bottom:18px; }
  .reading-now { font-size:clamp(22px,4vw,40px); line-height:1.3; }
  .reading-now strong { color:var(--accent); }
  .hidden { display:none; }
  code { background:#0c121d; padding:2px 6px; border-radius:5px; }
  /* Phone widths: one column so the panels aren't cramped, and stack the
     cramped input/button rows vertically. */
  @media (max-width: 720px) {
    main { grid-template-columns:minmax(0,1fr); }
    .full { grid-column:1; }
    .row { flex-direction:column; align-items:stretch; }
    .row > button { width:100%; }
  }
  /* Display role during the performance: the slide takes over the whole screen
     (teleprompter mode). Everything else is hidden. */
  body.stage-mode header,
  body.stage-mode main > section:not(#slidePanel) { display:none; }
  body.stage-mode main { display:block; max-width:none; padding:0; }
  body.stage-mode #slidePanel {
    position:fixed; inset:0; z-index:1000; margin:0; border:0; border-radius:0;
    background:var(--bg); display:flex; flex-direction:column;
  }
  body.stage-mode #slidePanel h2 { position:absolute; top:10px; right:14px; margin:0; opacity:.5; }
  #exitStage { position:absolute; top:10px; left:14px; z-index:1001; background:#0c121d; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 12px; cursor:pointer; }
  body.stage-mode #slide {
    flex:1; border:0; background:transparent; font-size:clamp(28px,5vw,64px);
    line-height:1.3; padding:6vw;
  }
  /* Readable, balanced slide text. The stage and the full-width reader view
     constrain line length and let names pop. */
  .stage-content { margin:0 auto; line-height:1.3; text-wrap:balance; }
  .stage-content strong { color:var(--accent); }
  body.stage-mode .stage-content { max-width:22ch; }
  /* When a panel takes the full width (host while performing, or the reader's
     own turn), make the stage text larger and give it room. */
  .panel.full #slide { font-size:clamp(22px,3.2vw,40px); min-height:240px; }
  .panel.full .stage-content { max-width:32ch; }
</style>
</head>
<body>
<header>
  📺 THE CHANNEL 0 NEWS <span class="live">● REALTIME</span>
  <span class="conn-group">
    <span id="roomPill" class="pill hidden"></span>
    <span id="conn" class="pill">disconnected</span>
  </span>
</header>

<main>
  <!-- connection -->
  <section class="panel full">
    <h2>Connect</h2>
    <div class="row">
      <div>
        <label>Role</label>
        <select id="role">
          <option value="player">Player</option>
          <option value="host">Host (control panel)</option>
          <option value="display">Display / submissions screen</option>
        </select>
      </div>
      <div id="codeField">
        <label>Room code</label>
        <input id="code" placeholder="ABCD" maxlength="8" autocapitalize="characters">
      </div>
      <div id="nameField" class="hidden">
        <label>Your name</label>
        <input id="pname" placeholder="Ann">
      </div>
      <button id="createBtn" class="primary">Create room</button>
      <button id="joinBtn">Connect</button>
    </div>
    <p id="hostCreds" class="muted hidden" style="margin:10px 0 0"></p>
  </section>

  <!-- host controls -->
  <section class="panel hidden" id="hostPanel">
    <h2>Host controls</h2>
    <div class="row">
      <div><label>Add player</label><input id="newPlayer" placeholder="Name"></div>
      <button id="addBtn">Add</button>
    </div>
    <div class="row" style="margin-top:10px; flex-wrap:wrap">
      <button id="collectBtn">Open submissions</button>
      <button id="startBtn">Start game</button>
    </div>
    <div class="row" style="margin-top:6px; flex-wrap:wrap">
      <button id="prevBtn">◀ Prev slide</button>
      <button id="nextBtn">Next slide ▶</button>
      <button id="archiveBtn">Archive round</button>
      <button id="newRoundBtn">New round</button>
    </div>
  </section>

  <!-- player form -->
  <section class="panel hidden" id="playerPanel">
    <h2>Your prompts
      <span id="submittedTag" class="submitted hidden">✓ submitted</span>
      <button id="promptsToggle" class="toggle hidden" title="Show / hide your prompts">▾</button>
    </h2>
    <p id="partnerLine" class="muted">Join to receive your assignment.</p>
    <div id="promptsBody">
      <div id="promptFields"></div>
      <button id="submitBtn" class="primary hidden" style="margin-top:10px">Submit responses</button>
    </div>
  </section>

  <!-- room state -->
  <section class="panel" id="statePanel">
    <h2>Room — <span id="phasePill" class="pill">—</span></h2>
    <p class="muted" id="progressLine">No room yet.</p>
    <ul class="players" id="playerList"></ul>
  </section>

  <!-- slide / display -->
  <section class="panel" id="slidePanel">
    <button id="exitStage" class="hidden">✕ Exit full screen</button>
    <h2>Stage <span id="slideIdx" class="pill">—</span>
      <button id="enterStage" class="toggle hidden" title="Full screen">⛶ Full screen</button>
    </h2>
    <div id="slide" class="muted">The carousel will appear here once the game starts.</div>
    <div id="readerControls" class="row hidden" style="margin-top:12px">
      <button id="rPrev">◀ Prev</button>
      <button id="rNext" class="primary">Next ▶</button>
    </div>
  </section>

  <!-- log -->
  <section class="panel full" id="logPanel">
    <h2>Event log (everything the server pushes)</h2>
    <div id="log"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let ws = null, role = "host", myName = null, hostToken = null, lastPrompts = [], assignmentRequested = false, amController = false;
let currentCode = null, autoRestoring = false, iSubmitted = false, promptsOpen = true, currentPhase = null, stageDismissed = false;

// Persist enough to rejoin after a page refresh (per-tab; the host token is
// secret so sessionStorage, not localStorage). A refresh re-runs restoreSession()
// which reconnects to the same room/role/name and the server replays the state.
const SESSION_KEY = "cz_session";
function saveSession() {
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ code: currentCode, role, name: myName, hostToken })); } catch (e) {}
}
function clearSession() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function restoreSession() {
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); } catch (e) {}
  if (!s || !s.code) return;
  $("role").value = s.role;
  $("code").value = s.code;
  if (s.name) $("pname").value = s.name;
  hostToken = s.hostToken || null;
  applyRoleUI();
  autoRestoring = true;
  connect();
}

function log(dir, obj) {
  const el = $("log");
  const t = new Date().toLocaleTimeString();
  el.textContent += `${t} ${dir} ${JSON.stringify(obj)}\n`;
  el.scrollTop = el.scrollHeight;
}
function send(msg) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(msg)); log("→", msg); } }
function setConn(s) { $("conn").textContent = s; }

function wsUrl() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}/ws`;
}

// ---- role UI toggling ----
function applyRoleUI() {
  role = $("role").value;
  $("nameField").classList.toggle("hidden", role !== "player");
  $("createBtn").classList.toggle("hidden", role !== "host");
  $("hostPanel").classList.toggle("hidden", role !== "host");
  $("playerPanel").classList.toggle("hidden", role !== "player");
  // The host creates a room and is *given* a code; only players/display type
  // one in to join. Hiding the code input avoids the impression that a typed
  // code is used at creation (the server always assigns a fresh unique code).
  $("codeField").classList.toggle("hidden", role === "host");
  $("joinBtn").classList.toggle("hidden", role === "host");
  // The raw event log is a debug aid for host/display; hide it from players.
  $("logPanel").classList.toggle("hidden", role === "player");
}
$("role").addEventListener("change", applyRoleUI);

// ---- create room (host) ----
$("createBtn").addEventListener("click", async () => {
  const res = await fetch("/api/rooms", { method: "POST" });
  if (!res.ok) { alert("create failed"); return; }
  const data = await res.json();
  hostToken = data.host_token;
  $("code").value = data.code;
  $("hostCreds").classList.remove("hidden");
  $("hostCreds").innerHTML = `Room <code>${data.code}</code> created. Players join with this code. Host token held in this tab.`;
  log("REST", { created: data.code });
  connect();
});

// ---- connect / join ----
$("joinBtn").addEventListener("click", connect);

function connect() {
  if (ws) { ws.close(); ws = null; }
  lastPrompts = []; assignmentRequested = false; amController = false;
  iSubmitted = false; promptsOpen = true; currentPhase = null; stageDismissed = false; applyPromptsUI();
  setStage(false); $("readerControls").classList.add("hidden");
  $("slidePanel").classList.remove("full");
  const code = $("code").value.trim().toUpperCase();
  if (!code) { alert("enter a room code"); return; }
  myName = role === "player" ? $("pname").value.trim() : null;
  if (role === "player" && !myName) { alert("enter your name"); return; }
  currentCode = code;

  ws = new WebSocket(wsUrl());
  setConn("connecting…");
  ws.onopen = () => {
    setConn("connected");
    send({ type: "join_room", code, role, name: myName, token: role === "host" ? hostToken : null });
  };
  ws.onclose = () => { setConn("disconnected"); $("roomPill").classList.add("hidden"); };
  ws.onerror = () => setConn("error");
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    log("←", msg);
    handle(msg);
  };
}

// ---- server event handling (exhaustive) ----
function handle(msg) {
  switch (msg.type) {
    case "joined":
      autoRestoring = false;
      saveSession();
      $("roomPill").textContent = `Room ${currentCode}`;
      $("roomPill").classList.remove("hidden");
      break;
    case "assignment": renderAssignment(msg); break;
    case "room_state": renderRoom(msg.room); maybeRequestAssignment(msg.room); break;
    case "submission_progress": renderProgress(msg); break;
    case "game_started": $("slideIdx").textContent = `0 / ${msg.total_slides}`; break;
    case "slide_changed": renderSlide(msg); break;
    case "pong": break;
    case "error":
      // A saved room that no longer exists (e.g. server restarted): drop the
      // stale session silently if we were auto-reconnecting.
      if (msg.code === "unknown_room") {
        clearSession();
        if (autoRestoring) { autoRestoring = false; break; }
      }
      alert(`${msg.code}: ${msg.message}`);
      break;
    default: console.warn("unknown server message", msg);
  }
}

// A player who joined while the room was still in the lobby has no assignment
// yet. Once the host opens submissions, fetch it by re-joining (idempotent —
// the server just replies with this player's partner + prompts). One-shot per
// connection so it can't loop.
function maybeRequestAssignment(room) {
  if (role === "player" && room.phase === "collecting" && lastPrompts.length === 0 && !assignmentRequested) {
    assignmentRequested = true;
    send({ type: "join_room", code: room.code, role: "player", name: myName });
  }
}

function renderRoom(room) {
  currentPhase = room.phase;
  $("phasePill").textContent = room.phase;
  $("slideIdx").textContent = `${room.current_slide} / ${room.total_slides}`;
  $("progressLine").textContent = `${room.players.length} player(s) · phase: ${room.phase}`;
  renderPlayers(room.players);
  // Leaving the performance (archived / new round) drops the stage + controls.
  if (room.phase !== "performing") {
    setStage(false);
    amController = false;
    stageDismissed = false; // re-arm full screen for the next performance
    $("readerControls").classList.add("hidden");
  }
  updateStageWidth();
  updateStageControls();
}

function setStage(on) { document.body.classList.toggle("stage-mode", on); updateStageControls(); }

// Show the Exit button while in full-screen stage; show the re-enter button for
// the display once it has dropped out of full screen mid-performance.
function updateStageControls() {
  const inStage = document.body.classList.contains("stage-mode");
  $("exitStage").classList.toggle("hidden", !inStage);
  $("enterStage").classList.toggle("hidden",
    !(role === "display" && currentPhase === "performing" && !inStage));
}

$("exitStage").addEventListener("click", () => { stageDismissed = true; setStage(false); });
$("enterStage").addEventListener("click", () => { stageDismissed = false; setStage(true); });

// The stage panel spans the full width for the host during the show and for the
// player whose turn it is to read (so their lines are large and easy to read).
function updateStageWidth() {
  const wide = currentPhase === "performing" &&
    (role === "host" || role === "display" || (role === "player" && amController));
  $("slidePanel").classList.toggle("full", wide);
}
function renderProgress(msg) {
  $("progressLine").textContent = `${msg.submitted} / ${msg.total} submitted`;
  renderPlayers(msg.players);
}
function renderPlayers(players) {
  $("playerList").innerHTML = players.map(p =>
    `<li><span>${escapeHtml(p.name)}</span>${p.submitted ? '<span class="submitted">✓ submitted</span>' : '<span class="muted">…</span>'}</li>`
  ).join("");
  // Track whether *this* player has submitted, and collapse their prompt box
  // the first time they do (they can reopen it with the corner toggle).
  if (role === "player" && myName) {
    const me = players.find(p => p.name === myName);
    const sub = !!(me && me.submitted);
    if (sub && !iSubmitted) promptsOpen = false; // auto-collapse on submit
    if (!sub) promptsOpen = true;                // new round: reopen
    iSubmitted = sub;
    applyPromptsUI();
  }
}

// Reflect the collapse state + show the toggle/tag once submitted.
function applyPromptsUI() {
  $("promptsBody").classList.toggle("hidden", !promptsOpen);
  $("promptsToggle").classList.toggle("hidden", !iSubmitted);
  $("promptsToggle").textContent = promptsOpen ? "▾" : "▸";
  $("submittedTag").classList.toggle("hidden", !iSubmitted);
}

function renderAssignment(msg) {
  lastPrompts = msg.prompts;
  $("partnerLine").innerHTML = `You're writing for <strong>${escapeHtml(msg.partner)}</strong>. Fill in each line:`;
  $("promptFields").innerHTML = msg.prompts.map((p, i) =>
    `<label>${escapeHtml(p) || "Prompt " + (i+1)}</label><textarea data-i="${i}" maxlength="200"></textarea>`
  ).join("") + `<label>…and remember:</label><textarea id="signoff" maxlength="200"></textarea>`;
  $("submitBtn").classList.remove("hidden");
  // Keep collapsed if we already submitted (e.g. reconnecting); else open.
  promptsOpen = !iSubmitted;
  applyPromptsUI();
}

$("submitBtn").addEventListener("click", () => {
  const responses = [...document.querySelectorAll("#promptFields textarea[data-i]")]
    .sort((a, b) => a.dataset.i - b.dataset.i).map(t => t.value);
  const signoff = ($("signoff") || {}).value || "";
  send({ type: "submit_responses", responses, signoff });
});

// Corner toggle to reopen / recollapse the prompt box after submitting.
$("promptsToggle").addEventListener("click", () => { promptsOpen = !promptsOpen; applyPromptsUI(); });

// The person who reads a given slide aloud (null for non-spoken slides).
function readerOf(s) {
  switch (s.kind) {
    case "script": return s.reader;
    case "greeting":
    case "signoff": return s.presenter;
    default: return null; // rules / presenter_intro / credits / blank
  }
}

// The slide's spoken/announcement content.
function slideContentHtml(s) {
  switch (s.kind) {
    case "rules": return "<div><strong>The rules</strong><br>When it's your turn to read, DO NOT LAUGH.<br>The host advances the slides.</div>";
    case "presenter_intro":
      return s.first
        ? `To start us off, <strong>${escapeHtml(s.presenter)}</strong> presents, with ${escapeHtml(s.teleprompter)} on teleprompter.`
        : `Next up: <strong>${escapeHtml(s.presenter)}</strong> reads, with ${escapeHtml(s.teleprompter)} on teleprompter.`;
    case "greeting": return `Good evening! I'm <strong>${escapeHtml(s.presenter)}</strong>, and this is today's Channel 0 News.`;
    case "script": return escapeHtml(s.text);
    case "signoff": return `That's all for today. This is ${escapeHtml(s.presenter)} signing off, and remember: ${escapeHtml(s.text)}`;
    case "credits": return "<strong>Thanks for playing!</strong>";
    case "blank": return "";
    default: return "?";
  }
}

function readingBanner(reader) {
  return `<div class="reading-now">🎤 <strong>${escapeHtml(reader)}</strong> is reading…</div>`;
}

function renderSlide(msg) {
  $("slideIdx").textContent = `${msg.index} / ${msg.total_slides}`;
  const s = msg.slide;
  const reader = readerOf(s);
  // The server tells us who may advance this slide (handles the rules slide,
  // where the first presenter — not derivable from the slide alone — controls).
  const controller = msg.controller || null;
  const content = slideContentHtml(s);
  const el = $("slide");
  el.classList.remove("muted");
  amController = !!(myName && controller && myName === controller);

  if (role === "display") {
    // The shared screen is the full-screen teleprompter (unless exited).
    el.innerHTML = `<div class="stage-content">${content}</div>`;
    setStage(!stageDismissed);
  } else if (role === "player") {
    setStage(false);
    if (amController) {
      // Your turn: show your lines (full width) + your own carousel controls.
      const badge = reader ? `<div class="badge">YOUR TURN TO READ 🎤</div>` : "";
      el.innerHTML = `${badge}<div class="stage-content">${content}</div>`;
    } else if (reader) {
      el.innerHTML = readingBanner(reader);
    } else {
      el.innerHTML = content; // transition / announcement: everyone sees it
    }
  } else {
    // Host: follow along with who's reading.
    el.innerHTML = (reader ? `<p class="muted" style="margin:0 0 8px">🎤 ${escapeHtml(reader)} is reading</p>` : "") + content;
    setStage(false);
  }
  // The reader gets their own Prev/Next while it's their segment.
  $("readerControls").classList.toggle("hidden", !(role === "player" && amController));
  updateStageWidth();
}

// ---- host control buttons ----
$("addBtn").addEventListener("click", () => {
  const name = $("newPlayer").value.trim();
  if (name) { send({ type: "add_player", name }); $("newPlayer").value = ""; }
});
$("collectBtn").addEventListener("click", () => send({ type: "start_collecting" }));
$("startBtn").addEventListener("click", () => send({ type: "start_game" }));
$("prevBtn").addEventListener("click", () => send({ type: "prev_slide" }));
$("nextBtn").addEventListener("click", () => send({ type: "advance_slide" }));
// Reader's own carousel controls.
$("rPrev").addEventListener("click", () => send({ type: "prev_slide" }));
$("rNext").addEventListener("click", () => send({ type: "advance_slide" }));
$("archiveBtn").addEventListener("click", () => send({ type: "archive_round" }));
$("newRoundBtn").addEventListener("click", () => send({ type: "new_round" }));

// keyboard: arrows drive the carousel for whoever is host
document.addEventListener("keydown", (e) => {
  if (!ws) return;
  const canDrive = role === "host" || (role === "player" && amController);
  if (!canDrive) return;
  if (e.key === "ArrowRight") send({ type: "advance_slide" });
  if (e.key === "ArrowLeft") send({ type: "prev_slide" });
});

function escapeHtml(s) { return (s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

applyRoleUI();
restoreSession();
</script>
</body>
</html>
