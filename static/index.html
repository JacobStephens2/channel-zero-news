<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Channel 0 News — realtime test client</title>
<style>
  :root { --bg:#0b0f17; --panel:#141b29; --ink:#e8eef7; --muted:#8aa0bf; --accent:#ff3b3b; --ok:#36d399; --line:#243049; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); overflow-x:hidden; }
  header { background:var(--accent); color:#fff; padding:10px 16px; font-weight:800; letter-spacing:.5px; display:flex; gap:12px; align-items:center; }
  header .live { font-size:11px; background:#000; padding:2px 8px; border-radius:99px; }
  main { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  .full { grid-column:1/3; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  input, textarea, select, button { font:inherit; }
  input, textarea, select { width:100%; background:#0c121d; border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:8px; }
  textarea { resize:vertical; min-height:54px; }
  button { background:#1f2d45; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:8px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row > * { flex:1; }
  .row > button { flex:0 0 auto; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:#0c121d; border:1px solid var(--line); }
  .players { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
  .players li { display:flex; justify-content:space-between; padding:6px 10px; background:#0c121d; border:1px solid var(--line); border-radius:7px; }
  .submitted { color:var(--ok); }
  #log { font-family:ui-monospace,Menlo,monospace; font-size:12px; height:200px; overflow:auto; background:#0c121d; border:1px solid var(--line); border-radius:7px; padding:8px; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
  #slide { min-height:160px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:20px; padding:20px; background:#0c121d; border:1px dashed var(--line); border-radius:10px; }
  .muted { color:var(--muted); }
  .hidden { display:none; }
  code { background:#0c121d; padding:2px 6px; border-radius:5px; }
  /* Phone widths: one column so the panels aren't cramped, and stack the
     cramped input/button rows vertically. */
  @media (max-width: 720px) {
    main { grid-template-columns:minmax(0,1fr); }
    .full { grid-column:1; }
    .row { flex-direction:column; align-items:stretch; }
    .row > button { width:100%; }
  }
</style>
</head>
<body>
<header>
  📺 THE CHANNEL 0 NEWS <span class="live">● REALTIME</span>
  <span id="conn" class="pill" style="margin-left:auto">disconnected</span>
</header>

<main>
  <!-- connection -->
  <section class="panel full">
    <h2>Connect</h2>
    <div class="row">
      <div>
        <label>Role</label>
        <select id="role">
          <option value="host">Host (control panel)</option>
          <option value="player">Player</option>
          <option value="display">Display / submissions screen</option>
        </select>
      </div>
      <div id="codeField">
        <label>Room code</label>
        <input id="code" placeholder="ABCD" maxlength="8" autocapitalize="characters">
      </div>
      <div id="nameField" class="hidden">
        <label>Your name (must match the roster)</label>
        <input id="pname" placeholder="Ann">
      </div>
      <button id="createBtn" class="primary">Create room</button>
      <button id="joinBtn">Connect</button>
    </div>
    <p id="hostCreds" class="muted hidden" style="margin:10px 0 0"></p>
  </section>

  <!-- host controls -->
  <section class="panel hidden" id="hostPanel">
    <h2>Host controls</h2>
    <div class="row">
      <div><label>Add player</label><input id="newPlayer" placeholder="Name"></div>
      <button id="addBtn">Add</button>
    </div>
    <div class="row" style="margin-top:10px; flex-wrap:wrap">
      <button id="collectBtn">Open submissions</button>
      <button id="startBtn">Start game</button>
    </div>
    <div class="row" style="margin-top:6px; flex-wrap:wrap">
      <button id="prevBtn">◀ Prev slide</button>
      <button id="nextBtn">Next slide ▶</button>
      <button id="archiveBtn">Archive round</button>
      <button id="newRoundBtn">New round</button>
    </div>
  </section>

  <!-- player form -->
  <section class="panel hidden" id="playerPanel">
    <h2>Your prompts</h2>
    <p id="partnerLine" class="muted">Join to receive your assignment.</p>
    <div id="promptFields"></div>
    <button id="submitBtn" class="primary hidden" style="margin-top:10px">Submit responses</button>
  </section>

  <!-- room state -->
  <section class="panel" id="statePanel">
    <h2>Room — <span id="phasePill" class="pill">—</span></h2>
    <p class="muted" id="progressLine">No room yet.</p>
    <ul class="players" id="playerList"></ul>
  </section>

  <!-- slide / display -->
  <section class="panel" id="slidePanel">
    <h2>Stage <span id="slideIdx" class="pill">—</span></h2>
    <div id="slide" class="muted">The carousel will appear here once the game starts.</div>
  </section>

  <!-- log -->
  <section class="panel full">
    <h2>Event log (everything the server pushes)</h2>
    <div id="log"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let ws = null, role = "host", myName = null, hostToken = null, lastPrompts = [];

function log(dir, obj) {
  const el = $("log");
  const t = new Date().toLocaleTimeString();
  el.textContent += `${t} ${dir} ${JSON.stringify(obj)}\n`;
  el.scrollTop = el.scrollHeight;
}
function send(msg) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(msg)); log("→", msg); } }
function setConn(s) { $("conn").textContent = s; }

function wsUrl() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}/ws`;
}

// ---- role UI toggling ----
function applyRoleUI() {
  role = $("role").value;
  $("nameField").classList.toggle("hidden", role !== "player");
  $("createBtn").classList.toggle("hidden", role !== "host");
  $("hostPanel").classList.toggle("hidden", role !== "host");
  $("playerPanel").classList.toggle("hidden", role !== "player");
}
$("role").addEventListener("change", applyRoleUI);

// ---- create room (host) ----
$("createBtn").addEventListener("click", async () => {
  const res = await fetch("/api/rooms", { method: "POST" });
  if (!res.ok) { alert("create failed"); return; }
  const data = await res.json();
  hostToken = data.host_token;
  $("code").value = data.code;
  $("hostCreds").classList.remove("hidden");
  $("hostCreds").innerHTML = `Room <code>${data.code}</code> created. Players join with this code. Host token held in this tab.`;
  log("REST", { created: data.code });
  connect();
});

// ---- connect / join ----
$("joinBtn").addEventListener("click", connect);

function connect() {
  if (ws) { ws.close(); ws = null; }
  const code = $("code").value.trim().toUpperCase();
  if (!code) { alert("enter a room code"); return; }
  myName = role === "player" ? $("pname").value.trim() : null;
  if (role === "player" && !myName) { alert("enter your name"); return; }

  ws = new WebSocket(wsUrl());
  setConn("connecting…");
  ws.onopen = () => {
    setConn("connected");
    send({ type: "join_room", code, role, name: myName, token: role === "host" ? hostToken : null });
  };
  ws.onclose = () => setConn("disconnected");
  ws.onerror = () => setConn("error");
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    log("←", msg);
    handle(msg);
  };
}

// ---- server event handling (exhaustive) ----
function handle(msg) {
  switch (msg.type) {
    case "joined": break;
    case "assignment": renderAssignment(msg); break;
    case "room_state": renderRoom(msg.room); break;
    case "submission_progress": renderProgress(msg); break;
    case "game_started": $("slideIdx").textContent = `0 / ${msg.total_slides}`; break;
    case "slide_changed": renderSlide(msg); break;
    case "pong": break;
    case "error": alert(`${msg.code}: ${msg.message}`); break;
    default: console.warn("unknown server message", msg);
  }
}

function renderRoom(room) {
  $("phasePill").textContent = room.phase;
  $("slideIdx").textContent = `${room.current_slide} / ${room.total_slides}`;
  $("progressLine").textContent = `${room.players.length} player(s) · phase: ${room.phase}`;
  renderPlayers(room.players);
}
function renderProgress(msg) {
  $("progressLine").textContent = `${msg.submitted} / ${msg.total} submitted`;
  renderPlayers(msg.players);
}
function renderPlayers(players) {
  $("playerList").innerHTML = players.map(p =>
    `<li><span>${escapeHtml(p.name)}</span>${p.submitted ? '<span class="submitted">✓ submitted</span>' : '<span class="muted">…</span>'}</li>`
  ).join("");
}

function renderAssignment(msg) {
  lastPrompts = msg.prompts;
  $("partnerLine").innerHTML = `You're writing for <strong>${escapeHtml(msg.partner)}</strong>. Fill in each line:`;
  $("promptFields").innerHTML = msg.prompts.map((p, i) =>
    `<label>${escapeHtml(p) || "Prompt " + (i+1)}</label><textarea data-i="${i}" maxlength="200"></textarea>`
  ).join("") + `<label>…and remember:</label><textarea id="signoff" maxlength="200"></textarea>`;
  $("submitBtn").classList.remove("hidden");
}

$("submitBtn").addEventListener("click", () => {
  const responses = [...document.querySelectorAll("#promptFields textarea[data-i]")]
    .sort((a, b) => a.dataset.i - b.dataset.i).map(t => t.value);
  const signoff = ($("signoff") || {}).value || "";
  send({ type: "submit_responses", responses, signoff });
});

function renderSlide(msg) {
  $("slideIdx").textContent = `${msg.index} / ${msg.total_slides}`;
  const s = msg.slide;
  let html = "";
  switch (s.kind) {
    case "rules": html = "<div><strong>The rules</strong><br>When it's your turn to read, DO NOT LAUGH.<br>Teleprompter operator advances the slides.</div>"; break;
    case "presenter_intro":
      html = s.first
        ? `To start us off, <strong>${escapeHtml(s.presenter)}</strong> presents, with ${escapeHtml(s.teleprompter)} on teleprompter.`
        : `Next up: <strong>${escapeHtml(s.presenter)}</strong> reads, with ${escapeHtml(s.teleprompter)} on teleprompter.`;
      break;
    case "greeting": html = `Good evening! I'm <strong>${escapeHtml(s.presenter)}</strong>, and this is today's Channel 0 News.`; break;
    case "script": html = escapeHtml(s.text); break;
    case "signoff": html = `That's all for today. This is ${escapeHtml(s.presenter)} signing off, and remember: ${escapeHtml(s.text)}`; break;
    case "credits": html = "<strong>Thanks for playing!</strong>"; break;
    case "blank": html = ""; break;
    default: html = "?";
  }
  $("slide").innerHTML = html;
  $("slide").classList.remove("muted");
}

// ---- host control buttons ----
$("addBtn").addEventListener("click", () => {
  const name = $("newPlayer").value.trim();
  if (name) { send({ type: "add_player", name }); $("newPlayer").value = ""; }
});
$("collectBtn").addEventListener("click", () => send({ type: "start_collecting" }));
$("startBtn").addEventListener("click", () => send({ type: "start_game" }));
$("prevBtn").addEventListener("click", () => send({ type: "prev_slide" }));
$("nextBtn").addEventListener("click", () => send({ type: "advance_slide" }));
$("archiveBtn").addEventListener("click", () => send({ type: "archive_round" }));
$("newRoundBtn").addEventListener("click", () => send({ type: "new_round" }));

// keyboard: arrows drive the carousel for whoever is host
document.addEventListener("keydown", (e) => {
  if (role !== "host" || !ws) return;
  if (e.key === "ArrowRight") send({ type: "advance_slide" });
  if (e.key === "ArrowLeft") send({ type: "prev_slide" });
});

function escapeHtml(s) { return (s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

applyRoleUI();
</script>
</body>
</html>
